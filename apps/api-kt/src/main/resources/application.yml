server:
  port: 5115
  # Let in-flight requests finish (up to the timeout below) before the JVM exits
  # on SIGTERM, instead of dropping them.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://localhost:3306/assetmgmt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AssetMgmtPool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000   # fail fast (30s) if the pool is exhausted
      idle-timeout: 600000        # retire idle connections after 10m
      # Recycle connections well before MySQL's wait_timeout drops them, so a
      # long-idle connection isn't handed out already-dead.
      max-lifetime: 1800000       # 30m
  jpa:
    # Disable Open Session In View: the Hibernate session is bound to the
    # transaction, not the HTTP request. Read endpoints that build DTOs from
    # lazy relations run within @Transactional(readOnly = true); DTOs are plain
    # data by the time serialization runs. This releases DB connections earlier
    # and surfaces lazy-load mistakes instead of masking them.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # Batch lazy/secondary to-one loads so a page of rows resolves its
        # relations in a few IN(...) queries instead of one-per-row (N+1) on
        # exports and sub-resource lists that don't fetch-join.
        default_batch_fetch_size: 100
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ""
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null


cors:
  origins: http://localhost:5173


scim:
  enabled: ${SCIM_ENABLED:false}
  default-role: ${SCIM_DEFAULT_ROLE:User}
  bearer-token: ${SCIM_BEARER_TOKEN:change-me-in-production}
  base-url: ${SCIM_BASE_URL:http://localhost:5115}

auth:
  # Azure App Service built-in authentication ("Easy Auth"). When enabled the
  # app trusts the X-MS-CLIENT-PRINCIPAL headers injected by the platform's auth
  # sidecar. Only ever enable this on an App Service where every request reaches
  # the container through that sidecar — anywhere else the headers are forgeable.
  easy-auth:
    enabled: ${EASY_AUTH_ENABLED:false}
    # There is deliberately no default role: an app role IS the grant of access,
    # so a principal that carries none is refused rather than admitted with
    # reduced rights.
    # Optional "entraAppRole:localRole,..." mapping. Empty means the Entra app
    # role values are used verbatim (name them Admin / Operator / User to match).
    role-map: ${EASY_AUTH_ROLE_MAP:}
    # Local stand-in for the App Service auth sidecar, so a developer machine can
    # exercise the same Easy Auth code path without an Azure deployment. Refuses
    # to start unless a dev/local/test profile is active — see
    # LocalEasyAuthEmulator. Enabled by the dev profile; never set this elsewhere.
    local-emulator:
      enabled: ${EASY_AUTH_LOCAL_EMULATOR:false}
      # Optional "key:email:Display Name:Role1|Role2" entries, comma-separated.
      # Blank uses the built-in admin / operator / user / norole identities.
      identities: ${EASY_AUTH_LOCAL_IDENTITIES:}

security:
  rate-limit:
    # Requests per minute per client IP. The default suits real users; local dev
    # and the e2e suite raise it in their profiles, since they drive far more
    # traffic from one address than a person ever would.
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

# Actuator: expose only health, and only UP/DOWN (no component details) so it's
# safe to leave the probe endpoints unauthenticated for orchestrators. Liveness
# = the app is running; readiness = the app AND its database are reachable.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
