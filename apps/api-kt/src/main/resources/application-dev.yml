spring:
  jpa:
    show-sql: true

logging:
  level:
    com.assetmanagement: DEBUG
    org.hibernate.SQL: DEBUG

# Local development authenticates through the same Easy Auth code path the app
# uses on Azure App Service, with the emulator standing in for the platform's
# auth sidecar. Sign in at http://localhost:5115/.auth/login/aad (or via the
# SPA, which redirects there). Moving to App Service means turning the emulator
# off and letting the real sidecar supply the headers — no code change.
auth:
  easy-auth:
    enabled: true
    local-emulator:
      enabled: true
      # The SPA runs on the Vite dev server, so signing in against the API's own
      # port should land there rather than on "/", which is nothing on this port.
      # (Through the SPA the /.auth proxy makes "/" correct anyway.)
      default-redirect: ${EASY_AUTH_DEFAULT_REDIRECT:http://localhost:5173/}

# A single developer/test machine makes far more requests from one IP than a
# real user, so the production-shaped rate limit would throttle it.
security:
  rate-limit:
    requests-per-minute: 100000

# SCIM is off by default. Enabled locally so the provisioning endpoints are
# exercised by the QA harness rather than being an untested corner.
scim:
  enabled: true
  bearer-token: dev-scim-token
